apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.backlog.mem_limit 5M

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/fluent-bit*.log
        multiline.parser  cri, docker
        DB                /var/fluent-bit/state/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  10
        storage.type      filesystem

    [INPUT]
        Name              systemd
        Tag               host.*
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Systemd_Filter    _SYSTEMD_UNIT=containerd.service
        Path              /var/log/journal
        DB                /var/fluent-bit/state/flb_journal.db
        Read_From_Tail    On
        storage.type      filesystem

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    [FILTER]
        Name    record_modifier
        Match   host.*
        Record  log_source node

    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch.opensearch.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     k8s-logs
        Logstash_DateFormat %Y.%m.%d
        Suppress_Type_Name  On
        Replace_Dots        On
        Trace_Error         On
        Retry_Limit         5
        tls                 Off

    [OUTPUT]
        Name                opensearch
        Match               host.*
        Host                opensearch.opensearch.svc.cluster.local
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     node-logs
        Logstash_DateFormat %Y.%m.%d
        Suppress_Type_Name  On
        Replace_Dots        On
        Trace_Error         On
        Retry_Limit         5
        tls                 Off

  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
