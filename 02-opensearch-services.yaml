apiVersion: v1
kind: Service
metadata:
  name: opensearch-headless
  namespace: opensearch
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
    - name: transport
      port: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: opensearch
spec:
  type: ClusterIP
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
